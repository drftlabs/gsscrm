<style>
:root{
  --brand:#4B0FA0; --brand-dark:#2A0660; --accent:#F0C000; --bg:#F6F3FA;
  --pink:#F01848; --green:#0ECD7F;
  --card:#FFFFFF; --ink:#1A1230; --muted:#6A6383; --line:#E2DCEC;
  --brand-soft:#EDE7F7; --accent-soft:#FCF3D5;
  --ok:#0B8F5C; --ok-soft:#E0F6EC; --warn:#8A6200; --warn-soft:#FCF1D6; --bad:#C01238; --bad-soft:#FCE4EA;
  --mono:'SF Mono',ui-monospace,'Cascadia Mono',Consolas,Arial,monospace; --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --r:16px; --shadow:0 1px 3px rgba(42,6,96,.06),0 8px 20px -12px rgba(42,6,96,.22);
  --shadow-lift:0 6px 18px rgba(42,6,96,.12),0 24px 48px -20px rgba(42,6,96,.38);
  --shadow-inset:inset 0 1px 0 rgba(255,255,255,.5);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:radial-gradient(1200px 600px at 100% -10%,rgba(240,192,0,.05),transparent 55%),radial-gradient(900px 500px at -10% 10%,rgba(75,15,160,.05),transparent 55%),var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink)}
a{color:var(--brand)}
.mono{font-family:var(--mono)}
.eyebrow{font-family:var(--sans);font-weight:600;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.shell{display:flex;min-height:100vh}
.side{width:224px;flex:0 0 224px;background:linear-gradient(175deg,var(--brand-dark) 0%,#180438 55%,#12032C 100%);color:#DDD3F0;padding:16px 12px 24px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:3px;overflow-y:auto;box-shadow:4px 0 24px -12px rgba(0,0,0,.4)}
.logo{display:block;width:100%;max-width:168px;margin:4px 10px}
.side .tagline{font-family:var(--sans);font-weight:600;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#9A8CC0;padding:0 10px 12px}
.navbtn{display:flex;align-items:center;gap:9px;width:100%;background:none;border:0;color:#BCAEDC;padding:8px 10px;border-radius:10px;cursor:pointer;text-align:left;font-weight:500;transition:background .15s,color .15s}
.navbtn:hover{background:rgba(255,255,255,.09);color:#fff}
.navbtn.on{background:linear-gradient(135deg,var(--brand),color-mix(in srgb,var(--brand) 70%,#8B2FE0));background:linear-gradient(135deg,var(--brand),#6A1FD0);color:#fff;box-shadow:inset 3px 0 0 var(--accent),0 4px 12px -4px rgba(75,15,160,.6)}
.navbtn .ic{flex:0 0 auto;display:inline-flex;opacity:.85}
.navbtn.on .ic{opacity:1}
.navbtn .k{font-family:var(--mono);font-size:11px;margin-left:auto;background:rgba(255,255,255,.14);padding:1px 6px;border-radius:99px}
.side .foot{margin-top:auto;padding:10px;font-size:11px;color:#9A8CC0;font-family:var(--mono)}
.side .foot b{color:#fff;display:block;font-family:var(--sans);font-size:12.5px}
.main{flex:1;min-width:0;padding:20px 22px 90px}
.topbar{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:22px;margin:0;letter-spacing:-.02em}
h2{font-size:15px;margin:0 0 10px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px;margin:2px 0 0}
.spacer{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow),var(--shadow-inset);transition:box-shadow .2s,transform .2s}
.card:hover{box-shadow:var(--shadow-lift),var(--shadow-inset);transform:translateY(-1px)}
.grid{display:grid;gap:12px}
.btn{background:var(--brand);background:linear-gradient(155deg,var(--brand),var(--brand-dark));color:#fff;border:0;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;box-shadow:0 2px 8px -2px rgba(42,6,96,.4),0 1px 0 rgba(255,255,255,.15) inset;transition:transform .12s,box-shadow .12s,filter .12s}
.btn:active{transform:translateY(1px);filter:brightness(.97)}
.btn:hover{filter:brightness(1.08);box-shadow:0 4px 14px -3px rgba(42,6,96,.5),0 1px 0 rgba(255,255,255,.15) inset}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:0 1px 2px rgba(20,32,43,.04)}
.btn.ghost:hover{border-color:var(--brand);color:var(--brand);box-shadow:0 2px 8px -3px rgba(75,15,160,.25);filter:none}
.btn.gold{background:linear-gradient(155deg,var(--accent),#D9A800);color:#3A2A00;box-shadow:0 2px 8px -2px rgba(217,168,0,.5),0 1px 0 rgba(255,255,255,.3) inset}
.btn.green{background:linear-gradient(155deg,var(--green),#0AB56B);color:#04301E;box-shadow:0 2px 8px -2px rgba(10,181,107,.45),0 1px 0 rgba(255,255,255,.3) inset}
.btn.pink{background:linear-gradient(155deg,var(--pink),#D40E3C);color:#fff;box-shadow:0 2px 8px -2px rgba(212,14,60,.45)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.wide{width:100%;justify-content:center}
input,select,textarea{width:100%;background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 10px;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
label.f{display:block;margin-bottom:9px}
label.f>span{display:block;font-family:var(--sans);font-weight:600;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.row{display:flex;gap:9px;flex-wrap:wrap}
.row>*{flex:1;min-width:130px}
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px}
.pill.g{background:linear-gradient(135deg,var(--ok-soft),#D2F0E2);color:var(--ok)}
.pill.a{background:linear-gradient(135deg,var(--warn-soft),#FBE7BD);color:var(--warn)}
.pill.r{background:linear-gradient(135deg,var(--bad-soft),#F8D2DA);color:var(--bad)}
.pill.b{background:linear-gradient(135deg,var(--brand-soft),#E1D5F5);color:var(--brand)}
.pill.n{background:#EFECF6;color:var(--muted)}
.pill.tag{background:linear-gradient(135deg,#1A1230,#2E1C52);color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sno{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:600;margin-right:2px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-family:var(--sans);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:9px 8px;border-bottom:1.5px solid var(--line);white-space:nowrap;background:linear-gradient(180deg,#FAFAFD,transparent)}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{transition:background .12s}
tr.click:hover{background:linear-gradient(90deg,var(--brand-soft),#FAF8FD);cursor:pointer}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.empty{padding:26px 14px;text-align:center;color:var(--muted);font-size:13.5px}
.empty b{display:block;color:var(--ink);margin-bottom:4px;font-size:14.5px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px}
.kpi{position:relative;overflow:hidden;background:linear-gradient(165deg,#fff,#FBFAFE);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px;box-shadow:var(--shadow);transition:box-shadow .2s,transform .2s}
.kpi:before{content:'';position:absolute;top:-30px;right:-30px;width:70px;height:70px;border-radius:99px;background:radial-gradient(circle,rgba(75,15,160,.06),transparent 70%)}
.kpi:hover{box-shadow:var(--shadow-lift);transform:translateY(-1px)}
.kpi .v{font-family:var(--mono);font-size:23px;font-weight:700;letter-spacing:-.02em;margin-top:5px;line-height:1.1}
.kpi small{display:block;color:var(--muted);font-size:11.5px;margin-top:3px}
.kpi.hi{border-left:3px solid var(--green);background:linear-gradient(165deg,#fff,var(--ok-soft) 220%)}
.kpi.warn{border-left:3px solid var(--accent);background:linear-gradient(165deg,#fff,var(--accent-soft) 220%)}
.kpi.bad{border-left:3px solid var(--pink);background:linear-gradient(165deg,#fff,var(--bad-soft) 220%)}
.dock{background:linear-gradient(150deg,var(--brand-dark) 0%,#1A0442 60%,#12032C 100%);border-radius:16px;padding:15px;color:#DDD3F0;box-shadow:var(--shadow-lift);position:relative;overflow:hidden}
.dock:before{content:'';position:absolute;top:-60px;right:-40px;width:180px;height:180px;border-radius:99px;background:radial-gradient(circle,rgba(240,192,0,.10),transparent 70%)}
.dock .eyebrow{color:#9A8CC0;position:relative}
.dock textarea{background:#150334;border:1px dashed #443070;color:#EFE9FA;font-family:var(--mono);font-size:13px;min-height:104px;resize:vertical;position:relative}
.dock textarea:focus{border-color:var(--accent);border-style:solid;box-shadow:0 0 0 3px rgba(240,192,0,.15)}
.dock select,.dock input{color:var(--ink);background:#fff;position:relative}
.dock .hint{font-size:11.5px;color:#9A8CC0;margin:7px 0 0;font-family:var(--mono);position:relative}
.parsed{margin-top:11px;display:grid;gap:8px;position:relative}
.pcard{background:#20064C;border:1px solid #3D1178;border-radius:10px;padding:10px;display:flex;gap:10px;align-items:flex-start}
.pcard.dupe{border-color:#7A5A1A;background:#2A1D08}
.pcard input[type=checkbox]{width:16px;height:16px;margin-top:3px;accent-color:var(--accent);flex:0 0 auto}
.pcard b{font-size:14px;color:#fff}
.pcard .fields{flex:1;min-width:0}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.chip{font-family:var(--mono);font-size:10.5px;background:linear-gradient(135deg,#31106A,#3D1680);border:1px solid #4C1D93;color:#C8B8E8;padding:3px 8px;border-radius:99px}
.chip.gold{background:linear-gradient(135deg,#3C2E00,#4A3800);border-color:#6B5300;color:#F5D65C}
.chip.miss{border-style:dashed;color:#8878AC}
.lead{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;box-shadow:var(--shadow);margin-bottom:10px;transition:box-shadow .2s,transform .2s}
.lead:hover{box-shadow:var(--shadow-lift);transform:translateY(-1px)}
.lead.mine{border-left:3px solid var(--brand);background:linear-gradient(90deg,var(--brand-soft) 0%,var(--card) 3%)}
.lead.dead{opacity:.62}
.lead.pri{border-left:3px solid var(--accent)}
.lead.compact{padding:9px 11px}
.chd{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pribox{display:inline-flex;align-items:center;cursor:pointer;flex:0 0 auto}
.pribox input{width:15px;height:15px;accent-color:var(--accent);cursor:pointer;margin:0}
.cname{font-size:14px;cursor:pointer;flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px}
.cmoney{margin-left:auto;font-family:var(--mono);font-weight:700;font-size:13px;white-space:nowrap}
.cmeta{display:flex;gap:9px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:4px;line-height:1.5}
.cmeta span{white-space:nowrap;display:inline-flex;align-items:center;gap:3px}
.cmeta .warn{color:var(--warn);font-weight:600}
.next.sm{margin-top:5px;font-size:12px;padding:4px 8px}
.lead.compact .qa{margin-top:7px;gap:5px}
.lead.compact .qa a,.lead.compact .qa button{padding:5px 9px;font-size:12px}
.lead.compact .qa a.call,.lead.compact .qa a.wa{padding:5px 8px}
.lead.compact .qa select.sm{min-width:100px;padding:5px 8px;font-size:12px}
.pill.sm{font-size:9.5px;padding:2px 6px}
.more{margin-top:6px}
.more summary{cursor:pointer;padding:4px 0;list-style:none}
.more summary::-webkit-details-marker{display:none}
.more summary:before{content:'▸ ';display:inline-block;transition:transform .15s}
.more[open] summary:before{transform:rotate(90deg)}
.more[open] .assign,.more[open] .latest,.more[open] .statusline{margin-top:8px}
.lead .hd{display:flex;gap:10px;align-items:flex-start}
.lead .nm{flex:1;min-width:0}
.lead .nm b{font-size:15.5px}
.lead .money{font-family:var(--mono);font-weight:600;white-space:nowrap}
.score{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:99px;border:1px solid}
.score.hot{color:var(--pink);border-color:var(--pink);background:linear-gradient(135deg,var(--bad-soft),#FBD9E1)}
.score.warm{color:var(--warn);border-color:var(--warn);background:linear-gradient(135deg,var(--warn-soft),#FCEBC5)}
.score.cold{color:var(--muted);border-color:var(--line);background:#F3F1F7}
.next{margin-top:7px;font-size:13px;background:var(--accent-soft);border-left:3px solid var(--accent);padding:6px 9px;border-radius:0 8px 8px 0}
.qa{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;align-items:center}
.qa a,.qa button{display:inline-flex;align-items:center;gap:5px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:12.5px;font-weight:600;text-decoration:none;color:var(--ink);cursor:pointer;box-shadow:0 1px 2px rgba(20,32,43,.04);transition:transform .12s,box-shadow .12s}
.qa a:hover,.qa button:hover{transform:translateY(-1px);box-shadow:0 3px 8px -3px rgba(20,32,43,.2)}
.qa a.call{border-color:var(--green);color:#08704A;background:linear-gradient(135deg,#fff,var(--ok-soft))}
.qa a.wa{border-color:#25D366;color:#0B7A43;background:linear-gradient(135deg,#fff,#DFF7E7)}
.qa button.tick{border-color:var(--green);color:#08704A}
.qa button.tick.on{background:linear-gradient(155deg,var(--green),#0AB56B);color:#04301E;box-shadow:0 2px 6px -2px rgba(10,181,107,.4)}
.qa button.cross{border-color:var(--pink);color:var(--pink)}
.qa button.cross.on{background:linear-gradient(155deg,var(--pink),#D40E3C);color:#fff;box-shadow:0 2px 6px -2px rgba(212,14,60,.4)}
.qa select{width:auto;min-width:130px;padding:6px 10px;border-radius:99px;font-size:12.5px}
.statusline{display:flex;gap:7px;align-items:center;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.statusline input{border-radius:99px;padding:7px 12px;font-size:13.5px}
.latest{display:flex;gap:7px;align-items:baseline;margin-top:8px;font-size:13.5px}
.latest .when{font-family:var(--mono);font-size:10.5px;color:var(--muted);white-space:nowrap}
.assign{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:9px}
.assign select{width:auto;min-width:140px;padding:5px 9px;font-size:13px;border-radius:99px}
.scrim{position:fixed;inset:0;background:rgba(26,4,60,.55);backdrop-filter:blur(2px);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:var(--bg);z-index:41;overflow-y:auto;box-shadow:-18px 0 50px -22px rgba(0,0,0,.55)}
.dhead{position:sticky;top:0;background:linear-gradient(180deg,var(--bg) 70%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:14px 16px;display:flex;align-items:flex-start;gap:10px;z-index:2}
.dbody{padding:14px 16px 40px;display:grid;gap:12px}
.x{background:#fff;border:1px solid var(--line);border-radius:10px;width:32px;height:32px;cursor:pointer;flex:0 0 auto;box-shadow:0 1px 2px rgba(20,32,43,.06);transition:box-shadow .15s,border-color .15s}
.x:hover{border-color:var(--brand);box-shadow:0 3px 8px -3px rgba(75,15,160,.3)}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.acts a,.acts button{display:flex;flex-direction:column;align-items:center;gap:5px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 6px;text-decoration:none;color:var(--ink);font-size:12px;font-weight:600;cursor:pointer;text-align:center;box-shadow:0 1px 2px rgba(20,32,43,.04);transition:border-color .15s,color .15s,box-shadow .15s,transform .15s}
.acts a:hover,.acts button:hover{border-color:var(--brand);color:var(--brand);box-shadow:0 4px 12px -4px rgba(75,15,160,.25);transform:translateY(-1px)}
.acts .ic{display:inline-flex;color:var(--brand)}
.log{border-left:2px solid var(--line);padding-left:11px;margin-left:4px;display:grid;gap:11px}
.log .it{position:relative}
.log .it:before{content:'';position:absolute;left:-16px;top:6px;width:7px;height:7px;border-radius:99px;background:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.log .it.pay:before{background:var(--green);box-shadow:0 0 0 3px var(--ok-soft)}
.log .it.inv:before{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.log .it.tk:before{background:var(--pink);box-shadow:0 0 0 3px var(--bad-soft)}
.log .it .m{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.05em}
.log .it p{margin:2px 0 0;font-size:13.5px;white-space:pre-wrap}
.steps{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.steps button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 10px;font-size:12px;cursor:pointer;transition:all .15s}
.steps button.on{background:linear-gradient(155deg,var(--brand),var(--brand-dark));color:#fff;border-color:var(--brand);box-shadow:0 2px 6px -2px rgba(75,15,160,.4)}
.bar{display:grid;gap:7px}
.bar .b{display:grid;grid-template-columns:124px 1fr 66px;gap:9px;align-items:center;font-size:13px}
.bar .t{height:9px;border-radius:99px;background:#EBE5F5;overflow:hidden}
.bar .t i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),color-mix(in srgb,var(--brand) 60%,var(--accent)));background:linear-gradient(90deg,var(--brand),#8A3FD8);border-radius:99px}
.bar .val{font-family:var(--mono);font-size:12px;text-align:right;color:var(--muted)}
.spark{width:100%;height:132px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.funnel{display:grid;gap:6px}
.funnel .f{display:grid;grid-template-columns:132px 1fr;gap:9px;align-items:center;font-size:13px}
.funnel .f i{display:flex;align-items:center;height:26px;border-radius:7px;background:linear-gradient(155deg,var(--brand),var(--brand-dark));color:#fff;font-family:var(--mono);font-size:11.5px;padding:0 8px;font-style:normal;min-width:34px;box-shadow:0 2px 6px -2px rgba(75,15,160,.4)}
.target{height:14px;border-radius:99px;background:#EBE5F5;overflow:hidden;margin:8px 0 4px;box-shadow:inset 0 1px 3px rgba(0,0,0,.08)}
.target i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--accent))}
.kan{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px}
.kan .col{flex:0 0 216px;background:linear-gradient(165deg,#F4F0FA,#EDE7F7);border-radius:14px;padding:10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.kan .col h3{margin:0 0 8px;font-size:12px;font-family:var(--sans);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.kan .mini{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px;margin-bottom:7px;cursor:pointer;font-size:13px;box-shadow:0 1px 3px rgba(20,32,43,.06);transition:box-shadow .15s,transform .15s}
.kan .mini:hover{box-shadow:0 4px 12px -4px rgba(75,15,160,.3);transform:translateY(-1px)}
.kan .mini b{display:block;font-size:13.5px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--brand-dark);color:#fff;padding:11px 16px;border-radius:99px;z-index:60;font-size:13.5px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .18s}
.toast.on{opacity:1}
.hamburger{display:none;position:fixed;top:12px;left:12px;z-index:35;width:42px;height:42px;border-radius:11px;border:0;
  background:linear-gradient(155deg,var(--brand),var(--brand-dark));box-shadow:0 3px 10px -2px rgba(42,6,96,.5);
  flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer}
.hamburger span{display:block;width:19px;height:2px;background:#fff;border-radius:2px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:99px;vertical-align:-2px;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.mobonly{display:none}
.itemrow{display:grid;grid-template-columns:1fr 58px 92px 30px;gap:6px;margin-bottom:6px}
.svcrow{display:grid;grid-template-columns:1fr 106px 30px;gap:6px;margin-bottom:6px;align-items:center}
.svcitem{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;background:linear-gradient(165deg,#FAFAFC,#F5F3FA);box-shadow:0 1px 2px rgba(20,32,43,.03)}
.tot{display:flex;justify-content:space-between;padding:5px 0;font-size:13.5px}
.tot.big{border-top:1px solid var(--line);margin-top:5px;padding-top:9px;font-weight:700;font-size:16px}
details.help{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px}
details.help summary{cursor:pointer;font-weight:600}
.checkline{display:flex;gap:8px;align-items:center;padding:5px 0;font-size:13.5px}
.checkline input{width:16px;height:16px;accent-color:var(--brand);flex:0 0 auto}
.gate{min-height:100vh;display:grid;place-items:center;padding:24px;background:
  radial-gradient(900px 460px at 12% -10%,rgba(240,192,0,.22),transparent 60%),
  radial-gradient(700px 420px at 90% 10%,rgba(240,24,72,.18),transparent 60%),
  radial-gradient(600px 500px at 50% 110%,rgba(14,205,127,.12),transparent 60%),
  linear-gradient(160deg,var(--brand-dark) 0%,#180438 55%,#0E0228 100%)}
.gatebox{width:min(392px,100%);background:#fff;border-radius:20px;padding:26px;box-shadow:0 30px 70px -30px rgba(0,0,0,.7),0 1px 0 rgba(255,255,255,.6) inset}
.gatebox .logo{max-width:190px;margin:0 0 4px}
.err{background:linear-gradient(135deg,var(--bad-soft),#F8D2DA);color:var(--bad);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:10px;border:1px solid #F3B8C4}
.dot{display:inline-block;width:7px;height:7px;border-radius:99px;background:var(--green);margin-right:5px;box-shadow:0 0 0 3px rgba(14,205,127,.18)}
.dot.off{background:var(--muted);box-shadow:none}.dot.err{background:var(--pink);box-shadow:0 0 0 3px rgba(240,24,72,.18)}
@media(max-width:820px){
  .hamburger{display:flex}
  .side{position:fixed;top:0;left:0;bottom:0;z-index:36;width:250px;transform:translateX(-105%);transition:transform .22s ease;box-shadow:none}
  .side.open{transform:translateX(0);box-shadow:16px 0 40px -20px rgba(0,0,0,.6)}

  set(d){try{if(window.localStorage)localStorage.setItem(KEY,JSON.stringify(d));}catch(e){}},
  tok(v){try{if(v===undefined)return sessionStorage.getItem(KEY+'-tok');v===null?sessionStorage.removeItem(KEY+'-tok'):sessionStorage.setItem(KEY+'-tok',v);}catch(e){}return null;},
  who(v){try{if(v===undefined){const w=sessionStorage.getItem(KEY+'-me');return w?JSON.parse(w):null;}

  // A tiny separate flag (not part of S, so it's never pushed as real data) tracking whether
  // this device has a change that hasn't been confirmed synced yet. Checked on boot so a
  // pull never silently discards a save that was still in flight when the tab last closed.
  unsynced(v){try{if(v===undefined)return localStorage.getItem(KEY+'-unsynced')==='1';

  if(S.settings.api&&me){pendingPush=true;syncState='pending';paintSync();
    clearTimeout(pushTimer);clearTimeout(pushRetryTimer);pushAttempts=0;
    // Short debounce, not the old 1.2s — on mobile the tab can background or the browser
    // can suspend JS execution almost immediately after a tap (switching apps, screen lock,
    // the phone call/notification interrupting), so waiting over a second before even
    // starting the network request was long enough to lose the save entirely.
    pushTimer=setTimeout(pushNow,350);}}
async function pushNow(){
  try{syncState='busy';paintSync();
    const r=await api('push',{data:S,tables:sheetRows()});
    if(r.ok){syncState='ok';pendingPush=false;pushAttempts=0;cache.unsynced(false);lastSync=new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});}
    else{scheduleRetry(r.error||'Sync failed');}
  }catch(e){scheduleRetry('Could not reach the backend');}
  paintSync();
}
// A failed or unreachable sync must never be silently dropped — that's how leads were
// disappearing: an unsynced change sat only in this browser's storage, and the next
// sign-in anywhere (which does a full pull-and-replace) overwrote it for good. Retrying
// with backoff, and flushing before the tab closes or backgrounds, closes that gap.
function scheduleRetry(msg){
  syncState='err';pushAttempts++;
  if(pushAttempts<=6){ // back off: 3s, 6s, 12s, 24s, 48s, 96s, then stop auto-retrying but stay flagged
    clearTimeout(pushRetryTimer);
    pushRetryTimer=setTimeout(pushNow,Math.min(96000,3000*Math.pow(2,pushAttempts-1)));
  }else{
    toast('Could not sync — tap the sync status to retry. Your changes are safe on this device.');
  }
}
// beforeunload/fetch cannot be relied on for mobile: the moment a phone browser backgrounds
// or the OS switches apps, the JS execution context is frequently suspended or killed
// outright before a normal fetch() promise ever resolves. navigator.sendBeacon is built
// specifically to survive that — the browser guarantees the request is queued and sent
// even after the page is gone, which a regular fetch cannot guarantee.
function beaconPush(){
  if(!S.settings.api||!me)return false;
  try{
    const body=JSON.stringify(Object.assign({action:'push',token:cache.tok(),data:S,tables:sheetRows()}));
    const blob=new Blob([body],{type:'text/plain;charset=utf-8'});
    const ok=navigator.sendBeacon(S.settings.api,blob);
    if(ok)cache.unsynced(false); // beacon queued successfully — trust it, can't get a response back
    return ok;
  }catch(e){return false;}
}
function flushPendingSync(){
  // Called when the tab is about to close/background/lose focus. If there's an unsynced
  // change sitting behind the debounce timer, get it out the door right now — sendBeacon
  // first since it's the only mechanism that reliably survives the page disappearing;
  // fall back to a normal push in case sendBeacon isn't available for some reason.
  if(!pendingPush||!S.settings.api||!me)return;
  clearTimeout(pushTimer);clearTimeout(pushRetryTimer);
  if(!(navigator.sendBeacon&&beaconPush()))pushNow();
}

// Periodic background refresh so a change made on someone else's device shows up here without
// needing a manual sign-out/sign-in. Only pulls when this device has nothing unsaved of its
// own — never risk clobbering a local edit that hasn't synced yet — and never while someone
// is actively mid-edit in a drawer (a pull would yank the form out from under them).
async function backgroundRefresh(){
  if(!S.settings.api||!me)return;
  if(pendingPush||cache.unsynced())return; // this device has something of its own to push first
  if($('#layer')&&$('#layer').firstChild)return; // a drawer/dialog is open — don't disturb it
  try{
    const keep=S.settings.api,p=await api('pull');
    if(p.ok&&p.data){
      const before=JSON.stringify({l:S.leads.length,i:S.invoices.length,p:S.payments.length});
      S=Object.assign(DEFAULTS(),p.data);S.settings=Object.assign(DEFAULTS().settings,p.data.settings||{});
      S.settings.api=keep;migrate();cache.set(S);
      const after=JSON.stringify({l:S.leads.length,i:S.invoices.length,p:S.payments.length});
      syncState='ok';paintSync();
      if(before!==after&&route!=='settings')render(); // something changed elsewhere — refresh what's on screen
    }
  }catch(e){}
}

    l.workAssignees=l.workAssignees||(l.assignedTo?[{username:l.assignedTo,confirmed:false}]:[]);
    if(!l.stage)l.stage={'Proposal Sent':'Quotation Sent','Negotiating':'Interested','Won':'Advance Paid'}[l.status]||l.status||'New';
    if(l.stage==='Advance Paid'&&l.work==='Not started')l.work='In progress';
    if(!l.tag)l.tag='GSS';

    if(!l.assignedTo){l.assignedTo=l.owner||'';l.assignedBy=l.owner||'';l.assignedAt=l.assignedAt||l.createdAt;}
  });

  // wiped so it's reassigned below in the new 507xxxxx format. Runs once — after this,
  // every lead in the system will only ever have the new format.
  if(!S.settings.custIdMigrated){

  // Process oldest-first so repeat numbers link to whichever lead came first, and every
  // lead — old or new — ends up with a proper 507xxxxx customer ID.
  (S.leads||[]).slice().sort((a,b)=>a.createdAt.localeCompare(b.createdAt))

async function signIn(){
  const local=!S.settings.api,pass=$('#gp').value;
  const btn=$('#gsign');
  if(local){
    if(!S.settings.localHash){
      if(pass.length<6)return gate('Use at least 6 characters.');
      if(pass!==$('#gp2').value)return gate('The two passwords do not match.');
      S.settings.localName=($('#gn').value.trim()||'Admin');
      S.settings.localSalt=uid('s');S.settings.localHash=await sha(S.settings.localSalt+'|'+pass);
      cache.set(S);me={name:S.settings.localName,role:'admin',username:'admin'};setDefaultFilter();return draw();
    }
    if(await sha(S.settings.localSalt+'|'+pass)!==S.settings.localHash)return gate('Wrong password.');

  }

  if(btn){btn.disabled=true;btn.innerHTML='<span class="spin"></span> Signing in…';}

  try{

    if(!r.ok){if(btn){btn.disabled=false;btn.textContent='Sign in';}return gate(r.error||'Could not sign in.');}
    cache.tok(r.token);me={name:r.name,role:r.role,username:r.username};cache.who(me);

    setDefaultFilter();draw();

    if(p.ok&&p.data){S=Object.assign(DEFAULTS(),p.data);S.settings=Object.assign(DEFAULTS().settings,p.data.settings||{});}

/* ---------- money helpers ---------- */
const invTotals=i=>{const sub=(i.items||[]).reduce((s,x)=>s+(Number(x.qty)||0)*(Number(x.rate)||0),0);
  const discAmt=i.discMode==='pct'?Math.round(sub*(Number(i.discount)||0)/100*100)/100:(Number(i.discount)||0);
  const base=Math.max(0,sub-discAmt),taxMode=i.taxMode||(i.gstOn===false?'none':(i.igst?'igst':'cgst')),
    rate=taxMode==='none'?0:(Number(i.gstRate)||0),tax=base*rate/100;
  return {sub,disc:discAmt,base,tax,cgst:taxMode==='cgst'?tax/2:0,sgst:taxMode==='cgst'?tax/2:0,igst:taxMode==='igst'?tax:0,total:Math.round((base+tax)*100)/100};};
const paidOn=id=>S.payments.filter(p=>p.invoiceId===id).reduce((s,p)=>s+(Number(p.amount)||0),0);

const invState=i=>{if(i.status==='cancelled')return 'cancelled';if(dueOn(i)<=0.5)return 'paid';
  if(paidOn(i.id)>0)return 'partial';if(i.type==='proforma')return 'proforma';return days(i.dueDate||i.date)>0?'overdue':'unpaid';};

const coOf=id=>S.companies.find(c=>c.id===id)||S.companies[0];

const leadFee=l=>(l.services||[]).reduce((s,x)=>s+(Number(x.rate)||0),0)||Number(l.fees)||0;
const leadSvcNames=l=>(l.services||[]).map(x=>x.name).join(' + ');

const leadPaid=id=>S.payments.filter(p=>p.leadId===id).reduce((s,p)=>s+Number(p.amount||0),0);

/* ---------- scoring & next action ---------- */
// Lead score ("hot meter") — deliberately NOT based on just having a phone number or being
// freshly added. It's driven almost entirely by two things: how far the lead has actually
// progressed (stage) and how much the deal is worth (value). A lead that's just been called
// sits low; a lead that's interested, been quoted, or paid an advance climbs fast. This is
// also what the pipeline forecast is built on, so the weighting has to reflect real intent,
// not data-entry completeness.
function score(l){
  if(DEAD.includes(l.stage))return 0;
  const f=leadFee(l);
  // Stage is the dominant signal — a wide spread so the meter has real range top to bottom.
  const stageBase={'New':5,'Contacted':10,'Call Later':14,'Interested':35,'Quotation Sent':52,'Advance Paid':82,'Completed':90,'On Hold':8}[l.stage]??5;
  let s=stageBase;
  // Value only matters once there's a live quoted/billed amount — a call with no value attached
  // shouldn't move the needle, but a high-value quotation should push it noticeably hotter.
  if(f>0&&['Interested','Quotation Sent','Advance Paid','Completed'].includes(l.stage)){
    if(f>=150000)s+=22;else if(f>=75000)s+=15;else if(f>=30000)s+=8;else if(f>0)s+=3;
  }

  // stale one cools more, but this alone can never make a bare New lead look hot.
  const quiet=days((l.lastTouch||l.createdAt).slice(0,10));
  if(['Interested','Quotation Sent'].includes(l.stage)){

  if(!l.assignedTo)return 'Assign this lead to someone';
  if(l.stage==='New')return 'First call — qualify the requirement';
  if(l.stage==='Contacted'&&!(l.services||[]).length)return 'Pin down which service they need';
  if(l.stage==='Interested'&&!S.invoices.some(i=>i.leadId===l.id))return 'Send the quotation';
  if(l.stage==='Quotation Sent'&&quiet>=2)return 'Chase the quotation — '+quiet+' days quiet';
  if(l.stage==='Advance Paid'&&l.work==='Not started')return 'Start the work and confirm a delivery date';
  if(l.work==='Sent for review'&&quiet>=3)return 'Ask for feedback on what you sent';

function startedMonth(leadId){
  // "Started" = either the first payment landed, or the lead was manually moved into

  // calendar month is when the full project value gets recognised.
  const l=leadOf(leadId);if(!l)return null;
  const ps=S.payments.filter(p=>p.leadId===leadId).sort((a,b)=>a.date<b.date?-1:1);
  const payMonth=ps.length?(ps[0].date||'').slice(0,7):null;

    const su=(l.statusUpdates||[]).find(u=>/advance received|status changed to advance paid|status changed to completed/i.test(u.text));

}

/* CSV import */
function parseCSV(text){
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}
    else if(c==='"')q=true;
    else if(c===','||c==='\t'){row.push(cur);cur='';}
    else if(c==='\n'){row.push(cur);cur='';if(row.some(x=>x.trim()))rows.push(row);row=[];}
    else if(c!=='\r')cur+=c;}
  row.push(cur);if(row.some(x=>x.trim()))rows.push(row);
  return rows;
}
function importCSV(text){
  const rows=parseCSV(text);if(!rows.length)return toast('That file looks empty');
  const head=rows[0].map(h=>h.toLowerCase().trim());
  const find=(...keys)=>head.findIndex(h=>keys.some(k=>h.includes(k)));
  const hasHeader=find('name','mobile','phone','service','fee','status')>-1;
  const idx=hasHeader?{name:find('name'),phone:find('mobile','phone','number','contact'),svc:find('service','requirement'),
    fee:find('fee','amount','price','value'),status:find('status','stage'),tag:find('tag','code','type'),
    email:find('email'),company:find('company','business')}:{name:0,phone:1,svc:2,fee:3,status:4,tag:-1,email:-1,company:-1};
  const body=hasHeader?rows.slice(1):rows;
  parsed=body.map(r=>{
    const g=i=>i>-1&&r[i]!==undefined?String(r[i]).trim():'';
    const codes=[];g(idx.svc).split(/[\s,+&/]+/).forEach(t=>{codesFrom(t).forEach(c=>{if(!codes.includes(c))codes.push(c);});});
    const svcTxt=g(idx.svc).toLowerCase();
    if(svcTxt)S.services.forEach(s=>{const key=s.name.toLowerCase();
      if((svcTxt.includes(key)||svcTxt.includes(key.split(' ')[0])&&key.split(' ')[0].length>4)&&!codes.includes(s.code))codes.push(s.code);});
    const phone=cleanPh(g(idx.phone)).slice(-10);
    const st=g(idx.status),stage=STAGES.find(x=>x.toLowerCase()===st.toLowerCase())||
      (/interest/i.test(st)?'Interested':/quot|propos/i.test(st)?'Quotation Sent':/advance|paid/i.test(st)?'Advance Paid':
       /fake/i.test(st)?'Fake':/hold/i.test(st)?'On Hold':/not|reject|no/i.test(st)&&st?'Not Interested':/done|complete/i.test(st)?'Completed':'New');
    const d=S.leads.find(l=>phone&&cleanPh(l.phone).slice(-10)===phone);
    return {name:g(idx.name)||'Unnamed',phone,email:g(idx.email),company:g(idx.company),city:'',
      codes,fee:feeFrom(g(idx.fee).replace(/[^\d.kKlL]/g,''))||Number(g(idx.fee).replace(/[^\d.]/g,''))||null,
      tag:(g(idx.tag)||'').toUpperCase()||'GSS',stage,msg:st?'Imported with status: '+st:'Imported from CSV',dupe:d?d.id:null,csv:true};
  }).filter(p=>p.name!=='Unnamed'||p.phone);
  drawParsed();
  toast(parsed.length+' rows read'+(hasHeader?'':' (no header row found — assumed name, mobile, service, fee, status)'));
}
/* ---------- parser ---------- */
function feeFrom(tok){const m=String(tok).replace(/[₹,\s]/g,'').match(/^(\d+(?:\.\d+)?)(k|l|lac|lakh|cr)?$/i);
  if(!m)return null;let n=parseFloat(m[1]);const u=(m[2]||'').toLowerCase();
  if(u==='k')n*=1e3;else if(u==='l'||u==='lac'||u==='lakh')n*=1e5;else if(u==='cr')n*=1e7;
  return n>=500?Math.round(n):null;}
function codeFrom(tok){const t=String(tok).toUpperCase().replace(/[^A-Z]/g,'');if(!t)return null;
  if(S.services.some(s=>s.code===t))return t;
  if(ALIAS[t]&&S.services.some(s=>s.code===ALIAS[t]))return ALIAS[t];return null;}
// Returns an array because bundle codes (like COMB) expand to more than one service.
function codesFrom(tok){const t=String(tok).toUpperCase().replace(/[^A-Z]/g,'');if(!t)return [];
  if(BUNDLES[t])return BUNDLES[t].slice();
  const c=codeFrom(tok);return c?[c]:[];}
function parseBlocks(txt){
  return txt.split(/\n\s*\n+/).map(b=>b.trim()).filter(Boolean).map(block=>{
    const labelled=/(^|\n)\s*(name|phone|mobile|email|service|message|requirement)\s*[:\-–]/i.test(block);
    const p=labelled?parseLabelled(block):parseShort(block);
    p.phone=cleanPh(p.phone).slice(-10);
    const d=S.leads.find(l=>(p.phone&&cleanPh(l.phone).slice(-10)===p.phone)||(p.email&&l.email&&l.email.toLowerCase()===p.email.toLowerCase()));
    p.dupe=d?d.id:null;p.raw=block;return p;});
}
function parseShort(block){
  const lines=block.split('\n').map(x=>x.trim()).filter(Boolean);
  let phone='',fee=null,codes=[],rates={},nameTok=[],notes=[],tag='';
  lines.forEach((line,li)=>{
    if(/^[\s+\d()-]+$/.test(line)){const m=line.match(/(?:\+?91[\s-]?)?[6-9]\d{4}[\s-]?\d{5}/);if(m&&!phone){phone=m[0];return;}}
    const toks=line.split(/[\s,/|]+/).filter(Boolean);
    // a number is a per-code rate only when the immediately preceding token was a code
    // AND the token right after this number is not itself another code continuing the same run —
    // simplest reliable rule: pair a number with a code only if exactly one code preceded it
    // since the last codeFrom() token, with no other code in between.
    let codeRun=[]; // codes seen since the last number/non-code token
    toks.forEach((t,ti)=>{
      const up=t.toUpperCase().replace(/[^A-Z]/g,'');
      if(li===0&&ti===0&&!tag&&up.length>=2&&up.length<=6&&t===t.toUpperCase()&&!codeFrom(t)&&!BUNDLES[up]&&!/\d/.test(t)){tag=up;return;}
      if(/^\+?\d[\d\s-]{8,}$/.test(t)&&!phone){phone=t;return;}
      const bundleExpand=BUNDLES[up];
      if(bundleExpand){bundleExpand.forEach(c=>{if(!codes.includes(c))codes.push(c);});codeRun=bundleExpand.slice();return;}
      const c=codeFrom(t);
      if(c){if(!codes.includes(c))codes.push(c);codeRun.push(c);return;}
      const f=feeFrom(t);
      if(f&&t.replace(/\D/g,'').length!==10){
        if(codeRun.length===1){rates[codeRun[0]]=f;}
        else if(codeRun.length===0&&fee==null){fee=f;}
        else if(codeRun.length>1&&fee==null){fee=f;} // trailing total after several codes (bundle or multi-code run)
        codeRun=[];
        return;
      }
      codeRun=[];
      if(/^[A-Za-z][A-Za-z.'-]*$/.test(t)&&fee==null&&!codes.length&&li===0)nameTok.push(t);else notes.push(t);});
  });
  const email=(block.match(/[\w.+-]+@[\w-]+\.[\w.]{2,}/)||[''])[0];
  return {name:nameTok.join(' ')||(email?email.split('@')[0]:'Unnamed'),phone,email,codes,fee,rates,tag:tag||'GSS',company:'',city:'',msg:notes.join(' ').slice(0,300)};
}
function parseLabelled(b){
  const get=re=>{const m=b.match(re);return m?m[m.length-1].trim():''};
  const email=(b.match(/[\w.+-]+@[\w-]+\.[\w.]{2,}/)||[''])[0];
  const phone=(b.match(/(?:\+?91[\s-]?)?[6-9]\d{4}[\s-]?\d{5}/)||[''])[0];
  const svcText=get(/(?:service|interested in|requirement|subject|looking for|enquiry for)\s*[:\-–]\s*(.+)$/im);
  const codes=[];svcText.split(/[\s,+&/]+/).forEach(t=>{codesFrom(t).forEach(c=>{if(!codes.includes(c))codes.push(c);});});
  if(svcText)S.services.forEach(s=>{const k=s.name.toLowerCase();const t=svcText.toLowerCase();
    if((t.includes(k)||t.includes(k.split(' ')[0])&&k.split(' ')[0].length>4)&&!codes.includes(s.code))codes.push(s.code);});
  let name=get(/^\s*(?:full\s*)?name\s*[:\-–]\s*(.+)$/im);
  if(!name){const c=b.split('\n').map(x=>x.trim()).filter(x=>x&&!/[@:]/.test(x)&&!/\d{5}/.test(x)&&/^[A-Za-z][A-Za-z .'-]+$/.test(x)&&x.length<44);name=c[0]||'';}
  return {name:name||(email?email.split('@')[0]:'Unnamed'),phone,email,codes,tag:'GSS',
    fee:feeFrom((get(/(?:fee|amount|budget|quote|price)\s*[:\-–]\s*(.+)$/im)||'').split(/\s+/)[0]),
    company:get(/(?:company|business|firm|startup|organisation)\s*(?:name)?\s*[:\-–]\s*(.+)$/im),
    city:get(/(?:city|location)\s*[:\-–]\s*(.+)$/im),
    msg:get(/(?:message|comments?|query|details|note)\s*[:\-–]\s*([\s\S]+)$/im)||svcText};
}
function splitFee(codes,fee,rates){
  if(!codes.length)return [];
  rates=rates||{};
  const list=codes.map(c=>{const s=svcOf(c)||{code:c,name:c,rate:0};
    return {code:c,name:s.name,rate:rates[c]!=null?rates[c]:Number(s.rate)||0};});
  const explicit=codes.filter(c=>rates[c]!=null);
  if(explicit.length===codes.length)return list;   // every code had its own number — done
  const remaining=list.filter(x=>rates[x.code]==null);
  const already=list.filter(x=>rates[x.code]!=null).reduce((s,x)=>s+x.rate,0);
  if(fee==null)return list;                          // no blended total given, keep list prices
  const leftFee=Math.max(0,fee-already);
  const base=remaining.reduce((s,x)=>s+x.rate,0);let left=leftFee;
  if(base>0)remaining.forEach((x,i)=>{const v=i===remaining.length-1?left:Math.round(leftFee*x.rate/base);x.rate=v;left-=v;});
  else{const each=Math.round(leftFee/Math.max(1,remaining.length));remaining.forEach((x,i)=>{x.rate=i===remaining.length-1?left:each;left-=each;});}
  return list;
}
let parsed=[];
function drawParsed(){
  const box=$('#parsed');if(!box)return;
  if(!parsed.length)return box.innerHTML='';
  box.innerHTML=parsed.map((p,i)=>{const svc=splitFee(p.codes,p.fee,p.rates);
    return `<div class="pcard ${p.dupe?'dupe':''}"><input type="checkbox" data-p="${i}" ${p.dupe?'':'checked'}>
    <div class="fields"><b>${esc(p.tag||'GSS')} · ${esc(p.name)}</b><div class="chips">
      <span class="chip${p.phone?'':' miss'}">${p.phone?esc(p.phone):'no phone'}</span>
      ${svc.length?svc.map(s=>`<span class="chip gold">${esc(s.name)}${s.rate?' · '+inr(s.rate):''}</span>`).join(''):'<span class="chip miss">no service code</span>'}
      ${p.fee?`<span class="chip">total ${inr(p.fee)}</span>`:''}
      ${p.stage&&p.stage!=='New'?`<span class="chip">${esc(p.stage)}</span>`:''}
      ${p.dupe?'<span class="chip" style="color:#F5D65C">already in list</span>':''}
    </div></div></div>`;}).join('')+`<button class="btn gold wide" id="commit">Add ${parsed.filter(p=>!p.dupe).length||parsed.length} leads</button>`;
}

// Clicking the Call or WhatsApp button logs it immediately — a real call was placed (or a
// WhatsApp chat opened) the moment the dialer/WhatsApp app launches, whether or not it
// connects. Outcome starts as "Pending" and can be updated afterward from the lead's call
// log, but the entry itself — and the fact that a call happened today — is never lost.
function logQuickCall(id,type){
  const l=leadOf(id);if(!l)return;
  l.logs=l.logs||[];
  l.logs.push({at:new Date().toISOString(),by:me.username,type,outcome:'Pending',text:''});
  l.lastTouch=new Date().toISOString();
  save();

function addUpdate(id,text,silent){
  const l=leadOf(id);if(!l||!text.trim())return;
  l.statusUpdates=l.statusUpdates||[];
  l.statusUpdates.push({at:new Date().toISOString(),by:me.username,text:text.trim()});
  l.lastTouch=new Date().toISOString();save();
  if(silent)return;
  const card=document.querySelector('[data-card="'+id+'"]');
  if(card){const line=card.querySelector('.latest');
    const html=`<span class="when">just now · ${esc(me.name)}</span><span>${esc(text.trim())}</span>`;
    if(line)line.innerHTML=html;else{const anchor=card.querySelector('.statusline')||card.querySelector('.assign');
      if(anchor)anchor.insertAdjacentHTML('beforebegin',`<div class="latest">${html}</div>`);}
    const sum=card.querySelector('.more summary');
    if(sum)sum.textContent='More — assign, update, history ('+l.statusUpdates.length+')';}
  toast('Update saved');
}

function assign(id,to){
  const l=leadOf(id);
  l.assignedTo=to||'';l.assignedBy=me.username;l.assignedAt=new Date().toISOString();
  (l.statusUpdates=l.statusUpdates||[]).push({at:new Date().toISOString(),by:me.username,text:to?('Assigned to '+nameOf(to)):'Unassigned'});
  audit('Assigned '+l.name+' to '+(nameOf(to)||'nobody'));save();

function setStage(id,st){
  const l=leadOf(id);
  if(st==='Call Later'){
    const d=prompt('Call back on which date? (YYYY-MM-DD)',new Date(Date.now()+2*864e5).toISOString().slice(0,10));
    if(!d)return;l.followUp=d;l.stage='Call Later';addUpdate(id,'Call back scheduled for '+fmtD(d),true);
  }else if(st==='Advance Paid'){
    l.stage='Advance Paid';if(l.work==='Not started')l.work='In progress';
    addUpdate(id,'Advance received — moved to projects',true);
  }else{l.stage=st;addUpdate(id,'Status changed to '+st,true);}
  audit('Stage of '+l.name+' → '+l.stage);save();render();toast(l.stage);
}

function timeline(l){
  const t=[];
  (l.statusUpdates||[]).forEach(u=>t.push({at:u.at,k:'',m:nameOf(u.by),p:u.text}));
  (l.logs||[]).forEach(x=>t.push({at:x.at,k:'',m:x.type+' · '+nameOf(x.by)+(x.outcome&&x.outcome!=='—'?' · '+x.outcome:''),p:x.text}));
  S.invoices.filter(i=>i.leadId===l.id).forEach(i=>t.push({at:i.date+'T09:00:00',k:'inv',m:(i.type==='tax'?'Invoice ':'Quotation ')+i.number,p:inr(invTotals(i).total)}));
  S.payments.filter(p=>p.leadId===l.id).forEach(p=>t.push({at:p.date+'T09:00:00',k:'pay',m:(p.kind||'Payment')+' · '+p.mode,p:inr(p.amount)+(p.ref?' · '+p.ref:'')}));
  S.tickets.filter(x=>x.leadId===l.id).forEach(x=>t.push({at:x.createdAt,k:'tk',m:'Ticket · '+x.status,p:x.title}));
  return t.sort((a,b)=>b.at<a.at?-1:1);
}

function togglePaymentIssue(id){

let projFilt={showCompleted:false};
function vProjects(){
  const all=leadRows('projects');
  // "Completed" hides by default, but a project marked Completed that still has money
  // outstanding must never disappear — that's a live balance check, not just trusting the
  // stage label, since someone could set the stage manually even with a balance still due.
  const isDone=l=>l.stage==='Completed'&&leadBalance(l.id)<=0.5;
  const rows=projFilt.showCompleted?all.filter(isDone):all.filter(l=>!isDone(l));
  const pending=all.reduce((s,l)=>s+leadBalance(l.id),0);
  const late=all.filter(l=>l.dueDate&&l.dueDate<today()&&l.work!=='Final delivered');
  const completedCount=all.filter(isDone).length;
  return `<div class="topbar"><div><h1>Projects</h1><p class="sub">Leads that paid an advance.</p></div><div class="spacer"></div>
    <button class="btn sm ${projFilt.showCompleted?'':'ghost'}" id="fcompleted">${projFilt.showCompleted?'← Back to ongoing':'Show completed ('+completedCount+')'}</button></div>
  <div class="kpis">
    ${kpi('Running',all.filter(l=>!isDone(l)).length,'ongoing or awaiting payment')}
    ${kpi('Completed',completedCount,'delivered &amp; fully paid','hi')}

}

    const invForCo=S.invoices.filter(i=>i.companyId===c.id&&i.type==='tax');

      return inv&&inv.companyId===c.id&&p.date>=bounds.from&&p.date<=bounds.to;})
      .reduce((s,p)=>s+Number(p.amount||0),0);
    const totalValue=invInFY.reduce((s,i)=>s+invTotals(i).total,0);

function sendReminder(leadId){
  const l=leadOf(leadId),co=coOf(l.companyId);
  const open=S.invoices.filter(i=>i.leadId===leadId&&i.type==='tax'&&dueOn(i)>0.5);
  const amt=open.length?open.reduce((s,i)=>s+dueOn(i),0):leadBalance(leadId);
  const list=open.map(i=>`${i.number} dated ${fmtD(i.date)} — ${inr(dueOn(i))} (due ${fmtD(i.dueDate||i.date)})`).join('\n');
  const pay=`${co.upi?'UPI: '+co.upi+'\n':''}${co.acName?'Account name: '+co.acName+'\n':''}${co.bank?'Bank: '+co.bank+'\n':''}${co.acNo?'Account no: '+co.acNo+'\n':''}${co.ifsc?'IFSC: '+co.ifsc+'\n':''}${co.gstin?'GSTIN: '+co.gstin+'\n':''}`;
  const subject=amt>0?`Payment reminder — ${co.name}`:`Following up — ${co.name}`;
  const body=amt>0?`Dear ${l.name},\n\nA gentle reminder about the pending balance on your project${leadSvcNames(l)?' ('+leadSvcNames(l)+')':''}.\n\n${list||'Balance outstanding: '+inr(amt)}\n\nTotal outstanding: ${inr(amt)}\n\nPayment details:\n${pay}\nIf you have already paid, please share the reference so we can update our records.\n\nRegards,\n${me.name}\n${co.name} · ${co.website||'getsetstartup.biz'}${co.phone?' · '+co.phone:''}`
    :`Dear ${l.name},\n\nFollowing up on our conversation${leadSvcNames(l)?' regarding '+leadSvcNames(l):''}. Do let me know how you would like to proceed.\n\nRegards,\n${me.name}\n${co.name} · ${co.website||'getsetstartup.biz'}`;
  layer(`<div class="dhead"><div style="flex:1"><div class="eyebrow">Reminder</div><h1 style="font-size:19px">${esc(l.name)}</h1>
    <div class="sub">${amt>0?inr(amt)+' outstanding':'Nothing pending'}</div></div><button class="x" data-close>✕</button></div>
  <div class="dbody"><div class="card">
    <label class="f"><span>Follow up on this date</span><input type="date" id="rdate" value="${l.followUp||new Date(Date.now()+864e5).toISOString().slice(0,10)}"></label>
    <p class="sub" style="margin:-4px 0 10px">Saving sets this as the lead's next follow-up — it'll show on your Team tab that day.</p>
    <label class="f"><span>Subject</span><input id="rsub" value="${esc(subject)}"></label>
    <label class="f"><span>Message</span><textarea id="rbody" rows="14" style="font-size:13.5px">${esc(body)}</textarea></label>
    <div class="acts"><button id="rmail"><span class="ic">${AICON.mail}</span>Open in email</button><button id="rwa"><span class="ic">${ICON_WA}</span>Send on WhatsApp</button>
    <button id="rcopy"><span class="ic">${AICON.copy}</span>Copy text</button><button id="rsave"><span class="ic">${AICON.clock}</span>Just save the date</button></div></div></div>`,()=>{});
  const saveDate=()=>{const d=$('#rdate').value;if(!d)return;l.followUp=d;
    addUpdate(leadId,'Follow-up set for '+fmtD(d),true);audit('Set follow-up for '+l.name+' on '+fmtD(d));save();};
  $('#rmail').onclick=()=>{if(!l.email)return toast('No email on this lead');
    saveDate();window.location.href=`mailto:${l.email}?subject=${encodeURIComponent($('#rsub').value)}&body=${encodeURIComponent($('#rbody').value)}`;addUpdate(leadId,'Reminder sent by email',true);};
  $('#rwa').onclick=()=>{if(!l.phone)return toast('No phone on this lead');
    saveDate();window.open(wa(l.phone)+'?text='+encodeURIComponent($('#rbody').value),'_blank');addUpdate(leadId,'Reminder sent on WhatsApp',true);};
  $('#rcopy').onclick=()=>{saveDate();copy($('#rbody').value);};
  $('#rsave').onclick=()=>{saveDate();closeLayer(true);render();toast('Follow-up saved for '+fmtD($('#rdate').value));};
}
function mailInvoice(invId){
  const i=S.invoices.find(x=>x.id===invId),l=leadOf(i.leadId),co=coOf(i.companyId);
  const t=invTotals(i);
  const sub=`${i.type==='tax'?'Invoice':'Quotation'} ${i.number} — ${co.name}`;
  const body=`Dear ${l?l.name:'Sir/Madam'},\n\nDetails of ${i.type==='tax'?'invoice':'quotation'} ${i.number} dated ${fmtD(i.date)}:\n\n${i.items.map(x=>`${x.name||x.desc} — ${x.qty} x ${inr(x.rate)} = ${inr(x.qty*x.rate)}`).join('\n')}\n\nGross: ${inr(t.sub)}${t.disc?'\nDiscount: -'+inr(t.disc):''}${(i.taxMode||'cgst')!=='none'?'\nGST @ '+i.gstRate+'%: '+inr(t.tax):''}\nNet payable: ${inr(t.total)}\nBalance: ${inr(dueOn(i))}\nDue date: ${fmtD(i.dueDate||i.date)}\n\nPayment details:\n${co.upi?'UPI: '+co.upi+'\n':''}${co.acName?'Account name: '+co.acName+'\n':''}${co.bank?'Bank: '+co.bank+'\n':''}${co.acNo?'Account no: '+co.acNo+'\n':''}${co.ifsc?'IFSC: '+co.ifsc+'\n':''}\nRegards,\n${me.name}\n${co.name} · ${co.website||'getsetstartup.biz'}`;
  if(l&&l.email)window.location.href=`mailto:${l.email}?subject=${encodeURIComponent(sub)}&body=${encodeURIComponent(body)}`;

}

function readImageAsDataURL(file,maxDim,cb){
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const tryRender=(dim,quality)=>{
        let w=img.width,h=img.height;
        if(w>h&&w>dim){h=Math.round(h*dim/w);w=dim;}
        else if(h>dim){w=Math.round(w*dim/h);h=dim;}
        const c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        const url=c.toDataURL('image/jpeg',quality);
        if(url.length>44000&&dim>80)tryRender(Math.round(dim*0.8),quality>0.5?quality-0.1:quality);
        else cb(url);
      };
      tryRender(maxDim,0.82);
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

/* ---------- layer ---------- */
function layer(html,onClose){
  closeLayer();
  const d=document.createElement('div');
  d.innerHTML=`<div class="scrim" data-close></div><div class="drawer" role="dialog">${html}</div>`;
  $('#layer').appendChild(d);document.body.style.overflow='hidden';d._onClose=onClose;
  d.querySelectorAll('[data-close]').forEach(x=>x.onclick=()=>closeLayer());
}
function closeLayer(skip){const l=$('#layer');if(!l.firstChild)return;
  const cb=l.firstChild._onClose;l.innerHTML='';document.body.style.overflow='';if(cb&&!skip)cb();}

document.addEventListener('click',async e=>{
  if(e.target.id!=='commitInbox')return;
  const keep=[...document.querySelectorAll('#inboxParsed input[type=checkbox]')].filter(c=>c.checked).map(c=>inbox[+c.dataset.ip]);
  if(!keep.length)return toast('Nothing selected');
  keep.forEach(p=>{
    const codes=[];(p.service||'').split(/[\s,+&/]+/).forEach(t=>{codesFrom(t).forEach(c=>{if(!codes.includes(c))codes.push(c);});});
    if(!codes.length&&p.service)S.services.forEach(sv=>{const k=sv.name.toLowerCase(),t=(p.service||'').toLowerCase();
      if((t.includes(k)||t.includes(k.split(' ')[0])&&k.split(' ')[0].length>4)&&!codes.includes(sv.code))codes.push(sv.code);});
    const l=newLead({name:p.name||'Unnamed',phone:cleanPh(p.phone).slice(-10),email:p.email||'',
      source:p.source||'Wix form',services:splitFee(codes,null,{}),notes:p.message||''});

  const ids=keep.map(p=>inbox.indexOf(p)).map(i=>inbox[i]&&inbox[i].id).filter(Boolean);
  try{await api('claimInbox',{ids});}catch(err){}

    document.querySelectorAll('[data-rmtag]').forEach(el=>el.onclick=()=>{S.tags.splice(+el.dataset.rmtag,1);save();render();});
  }
  if($('#addSvcCat')||document.querySelector('[data-cat]')){
    document.querySelectorAll('[data-cat]').forEach(el=>el.onchange=()=>{const s=S.services[+el.dataset.cat];if(!s)return;
      s[el.dataset.k]=el.dataset.k==='rate'?Number(el.value)||0:(el.dataset.k==='code'?el.value.toUpperCase().replace(/[^A-Z]/g,''):el.value);save();});
    document.querySelectorAll('[data-rmcat]').forEach(b=>b.onclick=()=>{
      if(confirm('Remove this service? Existing leads keep theirs.')){S.services.splice(+b.dataset.rmcat,1);save();render();}});
  }
  if($('#saveSet')){
    const grab=()=>document.querySelectorAll('[data-set]').forEach(el=>{const k=el.dataset.set;
      S.settings[k]=['gstRate','dueDays','defaultTarget'].includes(k)?Number(el.value)||0:el.value.trim();});
    $('#saveSet').onclick=()=>{grab();save();toast('Saved');render();};
    $('#saveTgt').onclick=()=>{grab();const v=Number($('#tgtMonth').value)||0;
      if(v)S.settings.targets[month()]=v;else delete S.settings.targets[month()];
      audit('Set monthly target '+inr(v));save();toast('Target saved');render();};
    $('#addCo').onclick=()=>editCompany(null);
    $('#testApi').onclick=async()=>{grab();cache.set(S);
      try{const r=await api('ping');toast(r.ok?'Backend reachable':'Backend replied with an error');}catch(e){toast('Could not reach it. Check the URL.');}};
    $('#pushNow').onclick=()=>{grab();S.settings.api?pushNow():toast('Add the web app URL first');};
    document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{S.settings.brand=Object.assign({},PRESETS[b.dataset.preset]);applyBrand();save();render();});
    document.querySelectorAll('[data-brand]').forEach(el=>{el.oninput=()=>{S.settings.brand[el.dataset.brand]=el.value;applyBrand();};el.onchange=()=>save();});
    const au=$('#addUser');au&&(au.onclick=addUserForm);
    const asrc=$('#addSrc');asrc&&(asrc.onclick=()=>editSource(null));
    document.querySelectorAll('[data-editsrc]').forEach(b=>b.onclick=()=>editSource(b.dataset.editsrc));
    document.querySelectorAll('[data-stgup]').forEach(b=>b.onclick=()=>{const i=+b.dataset.stgup,a=S.settings.stageOrder;
      [a[i-1],a[i]]=[a[i],a[i-1]];audit('Reordered pipeline stages');save();render();});
    document.querySelectorAll('[data-stgdown]').forEach(b=>b.onclick=()=>{const i=+b.dataset.stgdown,a=S.settings.stageOrder;
      [a[i+1],a[i]]=[a[i],a[i+1]];audit('Reordered pipeline stages');save();render();});
    document.querySelectorAll('[data-rmstage]').forEach(b=>b.onclick=()=>{
      S.settings.customStages.splice(+b.dataset.rmstage,1);save();render();});
    const asg=$('#addStage');asg&&(asg.onclick=()=>{const v=$('#newStage').value.trim();if(!v)return;
      if(STAGES.includes(v)||S.settings.customStages.includes(v))return toast('That stage already exists');
      S.settings.customStages.push(v);audit('Added stage: '+v);save();render();});
    document.querySelectorAll('[data-rmlogtype]').forEach(b=>b.onclick=()=>{S.settings.logTypes.splice(+b.dataset.rmlogtype,1);save();render();});
    document.querySelectorAll('[data-rmlogout]').forEach(b=>b.onclick=()=>{S.settings.logOutcomes.splice(+b.dataset.rmlogout,1);save();render();});
    const alt=$('#addLogType');alt&&(alt.onclick=()=>{const v=$('#newLogType').value.trim();if(!v)return;
      if(S.settings.logTypes.includes(v))return toast('Already there');S.settings.logTypes.push(v);save();render();});
    const alo=$('#addLogOut');alo&&(alo.onclick=()=>{const v=$('#newLogOut').value.trim();if(!v)return;
      if(S.settings.logOutcomes.includes(v))return toast('Already there');S.settings.logOutcomes.push(v);save();render();});
    if($('#userBox'))loadUsers();
    if($('#auBox')){auditShown=25;drawAudit();$('#auUser').onchange=()=>{auditShown=25;drawAudit();};
      $('#auExport').onclick=()=>download('gss-activity-log.csv',toCSV(sheetRows().ActivityLog));
      const am=$('#auMore');am&&(am.onclick=()=>{auditShown+=25;drawAudit();});}
    const cp=$('#chPass');cp&&(cp.onclick=()=>editProfile('admin'));
    const ej=$('#expJson');ej&&(ej.onclick=()=>download('gss-crm-backup-'+today()+'.json',JSON.stringify(S,null,2),'application/json'));
    const el2=$('#expLeads');el2&&(el2.onclick=()=>download('gss-leads.csv',toCSV(sheetRows().Leads)));
    const eiv=$('#expInvSet');eiv&&(eiv.onclick=()=>download('gss-invoices.csv',toCSV(sheetRows().Invoices)));
    const epy=$('#expPaySet');epy&&(epy.onclick=()=>download('gss-payments.csv',toCSV(sheetRows().Payments)));
    const eall=$('#expAll');eall&&(eall.onclick=()=>{
      const rows=sheetRows();
      download('gss-leads.csv',toCSV(rows.Leads));
      setTimeout(()=>download('gss-invoices.csv',toCSV(rows.Invoices)),300);
      setTimeout(()=>download('gss-payments.csv',toCSV(rows.Payments)),600);
      setTimeout(()=>download('gss-tickets.csv',toCSV(rows.Tickets)),900);
      toast('Downloading 4 files…');});
    const ij=$('#impJson');ij&&(ij.onclick=()=>$('#fileIn').click());
    const fi=$('#fileIn');fi&&(fi.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
      r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.leads)throw 0;const a=S.settings.api,h=S.settings.localHash,s0=S.settings.localSalt;
        S=Object.assign(DEFAULTS(),d);S.settings=Object.assign(DEFAULTS().settings,d.settings||{},{api:a,localHash:h,localSalt:s0});
        migrate();applyBrand();save();render();toast('Backup restored');}catch(x){toast('That file is not a CRM backup');}};
      r.readAsText(f);});
    const wp=$('#wipe');wp&&(wp.onclick=()=>{if(confirm('Erase every lead, invoice and payment?')&&confirm('Really erase everything?')){
      const keep=S.settings;S=DEFAULTS();S.settings=keep;audit('Erased all data');save();render();}});
  }
}
// Customer ID system: every phone number maps to one customer ID. If a new lead's
// phone matches an existing lead's phone, they share the same customer ID — this is
// how repeat clients, and their whole history (leads, invoices, payments), get tied together.
// Format: 507 followed by a 5-digit sequence, e.g. 50700001, 50700002, ...
function nextCustomerId(){
  S.seq.CUST=(S.seq.CUST||0)+1;
  return '507'+String(S.seq.CUST).padStart(5,'0');
}
function customerIdFor(phone){
  const ph=cleanPh(phone).slice(-10);
  if(!ph)return '';
  const existing=S.leads.find(l=>l.customerId&&cleanPh(l.phone).slice(-10)===ph);
  if(existing)return existing.customerId;
  return nextCustomerId();
}
function matchCustomerId(lead){
  if(!lead.phone){if(!lead.customerId){lead.customerId=nextCustomerId();}return;}
  lead.customerId=customerIdFor(lead.phone);
}
function customerLeads(customerId){return S.leads.filter(l=>l.customerId===customerId);}
function customerInvoices(customerId){const ids=customerLeads(customerId).map(l=>l.id);return S.invoices.filter(i=>ids.includes(i.leadId));}
function customerPayments(customerId){const ids=customerLeads(customerId).map(l=>l.id);return S.payments.filter(p=>ids.includes(p.leadId));}
function newLead(o){
  return Object.assign({id:uid('ld'),name:'',phone:'',altPhone:'',email:'',company:'',addr:'',city:'',state:'',pin:'',poc:'',gstin:'',source:'Other',tag:'GSS',
    customerId:'',services:[],fees:0,stage:'New',work:'Not started',workAssignees:[],statusUpdates:[],docs:[],notes:'',logs:[],followUp:'',dueDate:'',priority:false,flagForStaff:false,
    assignedTo:me?me.username:'',assignedBy:me?me.username:'',assignedAt:new Date().toISOString(),paymentIssue:false,companyId:S.companies[0].id,owner:me?me.username:'',
    createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),lastTouch:''},o);
}
